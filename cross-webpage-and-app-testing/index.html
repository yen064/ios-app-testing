<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cross Webpage and App Testing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Cross Webpage and App Testing</h1>
    <p>
      這個頁面用來測試「Safari 網頁 → 喚起 iOS App → 回到 Safari」的流程。
      點擊下方按鈕會嘗試用 <code>crosswebapp://</code> 這個 Custom URL Scheme 開啟對應的 iOS App。
    </p>

    <button id="open-app-button" type="button">開啟 App</button>

    <p id="status" role="status" aria-live="polite"></p>

    <p class="hint">
      如果按鈕沒有反應，代表目前裝置上沒有安裝對應的 App
      （<code>cross-webpage-and-ios-app-testing</code>），或不是在 Safari 中開啟本頁。
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
